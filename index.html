<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}[hidden]{display:none!important}body{margin:0;font-size:14px}</style></head><body><title>Parkpilot Rust</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b6e63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D map; floating search pill on top, action buttons on the right, bottom sheet / nav bars as overlays */
:root {
  --paper: #fffdf7; --paper-2: #f4efe3; --ink: #15323b; --ink-2: #5a6b70; --line: #e6dfcf;
  --accent: #1f8bff; --accent-2: #0f6fd6; --on-accent: #ffffff;
  --lagoon: #0b6e63; --lagoon-2: #0f8476; --on-lagoon: #ffffff;
  --sun: #ffc53d; --pin: #ff4d6d;
  --c-coaster: #e8483f; --c-ride: #8a5cd1; --c-water: #1f8bff; --c-show: #d0428f; --c-food: #f08a24; --c-wc: #6c7a80;
  --c-shop: #12a19a; --c-hotel: #5a6fd6; --c-station: #2f7d4f; --c-entrance: #0b6e63; --c-aid: #e03b3b; --c-waterpark: #1aa3c8;
  --shadow: 0 10px 30px rgba(21, 50, 59, .16), 0 2px 6px rgba(21, 50, 59, .10);
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-pill: 999px; --r-card: 22px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #132229; --paper-2: #1b2f37; --ink: #e9f2f1; --ink-2: #9fb3b5; --line: #29404a;
  --accent: #4aa3ff; --accent-2: #2f8cf0; --lagoon: #0d7a6d; --lagoon-2: #12907f;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #132229; --paper-2: #1b2f37; --ink: #e9f2f1; --ink-2: #9fb3b5; --line: #29404a;
  --accent: #4aa3ff; --accent-2: #2f8cf0; --lagoon: #0d7a6d; --lagoon-2: #12907f;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3); color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: relative; height: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; }
#map canvas { display: block; width: 100%; height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
svg { width: 22px; height: 22px; flex: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* labels */
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 2px;
  border: 0; border-radius: var(--r-pill); background: color-mix(in srgb, var(--paper) 92%, transparent); box-shadow: 0 2px 8px rgba(21,50,59,.18);
  font: 600 12.5px/1 var(--f-body); white-space: nowrap; will-change: transform; transition: opacity .2s; }
.lbl.c-wc { padding: 0 2px; }
.lbl-ico { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; background: var(--cat, var(--c-ride)); }
.lbl-ico svg { width: 15px; height: 15px; }
.lbl.is-dest { background: var(--pin); color: #fff; z-index: 2; }
.lbl.is-dest .lbl-ico { background: #fff; color: var(--pin); }
.c-coaster { --cat: var(--c-coaster); } .c-ride { --cat: var(--c-ride); } .c-water { --cat: var(--c-water); } .c-show { --cat: var(--c-show); }
.c-food { --cat: var(--c-food); } .c-wc { --cat: var(--c-wc); } .c-shop { --cat: var(--c-shop); } .c-hotel { --cat: var(--c-hotel); }
.c-station { --cat: var(--c-station); } .c-entrance { --cat: var(--c-entrance); } .c-aid { --cat: var(--c-aid); } .c-waterpark { --cat: var(--c-waterpark); }

/* top search */
.topbar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 0; right: 0; display: flex; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.search-pill { pointer-events: auto; display: flex; align-items: center; gap: 10px; width: min(560px, 100%); height: 52px; padding: 0 18px; border: 0;
  border-radius: var(--r-pill); background: var(--paper); box-shadow: var(--shadow); font: 600 16px var(--f-body); color: var(--ink-2); text-align: left; }
.search-pill svg { color: var(--accent); }
.loc-chip { position: absolute; top: calc(72px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); max-width: calc(100% - 100px);
  display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--paper) 90%, transparent);
  box-shadow: 0 2px 10px rgba(21,50,59,.14); font: 500 12.5px var(--f-body); color: var(--ink-2); }
.loc-chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sun) 35%, transparent); flex: none; }
.loc-chip .dot-live { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.chip-btn { border: 0; border-radius: var(--r-pill); padding: 5px 10px; background: var(--paper-2); font: 700 12px var(--f-body); color: var(--accent-2); }
@media (max-width: 420px) { .loc-hint { display: none; } }

/* floating buttons */
.fabs { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(76px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 10px; }
.fab { width: 46px; height: 46px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--paper); box-shadow: var(--shadow);
  font: 800 14px var(--f-display); color: var(--ink); }
#needle { transition: transform .08s linear; }
#needle svg { width: 26px; height: 26px; }

/* bottom sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--paper); border-radius: var(--r-card) var(--r-card) 0 0;
  box-shadow: 0 -8px 30px rgba(21,50,59,.18); padding-block: 8px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; max-height: 46%; animation: up .35s cubic-bezier(.2,.9,.3,1.15); }
@media (min-width: 760px) { .sheet { left: 16px; right: auto; bottom: 16px; width: 380px; border-radius: var(--r-card); max-height: calc(100% - 120px); padding-block: 8px 16px; } }
.sheet.expanded { max-height: 82%; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.place { display: flex; align-items: center; gap: 12px; }
.place-ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: var(--cat, var(--c-ride)); flex: none; }
.place-ico.sm { width: 36px; height: 36px; border-radius: 12px; }
.place-ico.sm svg { width: 19px; height: 19px; }
.place-txt { flex: 1; min-width: 0; }
.place-txt h2 { margin: 0; font: 800 22px/1.1 var(--f-display); text-wrap: balance; }
.place-txt p { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--paper-2); display: grid; place-items: center; flex: none; }
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border: 0; border-radius: var(--r-pill); background: var(--accent);
  color: var(--on-accent); font: 700 17px var(--f-body); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn-primary svg { width: 20px; height: 20px; }
.btn-ghost { height: 52px; padding: 0 18px; border: 2px solid var(--line); border-radius: var(--r-pill); background: transparent; font: 700 15px var(--f-body); }
.row { display: flex; gap: 10px; } .grow { flex: 1; }
.route-sum { display: flex; align-items: baseline; gap: 10px; }
.route-sum strong { font: 800 30px/1 var(--f-display); color: var(--lagoon); }
.route-sum span { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 0; padding: 0; display: none; overflow-y: auto; border-top: 1px solid var(--line); }
.sheet.expanded .steps { display: block; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.st-ico { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: var(--paper-2); color: var(--lagoon); flex: none; }
.st-txt { flex: 1; min-width: 0; }
.st-d { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 13px; }

/* navigation */
.nav-top { position: absolute; z-index: 6; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  max-width: 560px; margin: 0 auto; border-radius: var(--r-card); background: var(--lagoon); color: var(--on-lagoon); box-shadow: var(--shadow); overflow: hidden; }
.nav-main { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.nav-ico { width: 56px; height: 56px; display: grid; place-items: center; flex: none; }
.nav-ico svg { width: 52px; height: 52px; }
.nav-dist { font: 800 32px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.nav-text { font: 600 17px/1.25 var(--f-body); margin-top: 2px; text-wrap: balance; }
.nav-then { display: flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--lagoon-2); font: 600 14px var(--f-body); }
.then-ico svg { width: 18px; height: 18px; vertical-align: -4px; }
.nav-top.soon .nav-ico { animation: nudge .8s ease-in-out infinite alternate; }
.nav-top.arrived { background: var(--pin); }
@keyframes nudge { to { transform: scale(1.12); } }
.nav-bottom { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; background: var(--paper); border-radius: var(--r-card) var(--r-card) 0 0; box-shadow: 0 -8px 30px rgba(21,50,59,.18);
  padding-block: 12px calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 760px) { .nav-bottom { left: 50%; right: auto; transform: translateX(-50%); width: 520px; bottom: 16px; border-radius: var(--r-card); padding-block: 12px 14px; } }
.nb-row { display: flex; align-items: center; gap: 12px; }
.nb-eta { flex: 1; min-width: 0; }
.nb-eta b { font: 800 26px/1 var(--f-display); color: var(--lagoon); font-variant-numeric: tabular-nums; }
.nb-eta small { display: block; color: var(--ink-2); font-size: 14px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.btn-end { height: 46px; padding: 0 20px; border: 0; border-radius: var(--r-pill); background: #e5484d; color: #fff; font: 700 15px var(--f-body); }
.icon-btn.on { background: var(--accent); color: #fff; }
.sim { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.sim .lab { margin-right: auto; }
.seg { display: flex; background: var(--paper-2); border-radius: var(--r-pill); padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: var(--r-pill); font: 700 13px var(--f-body); color: var(--ink-2); }
.seg button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.recenter { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); height: 44px; padding: 0 18px; border: 0;
  border-radius: var(--r-pill); background: var(--paper); color: var(--accent-2); box-shadow: var(--shadow); font: 700 15px var(--f-body); display: flex; align-items: center; gap: 8px; }

/* search panel */
.search-panel { position: absolute; inset: 0; z-index: 8; background: var(--paper); display: flex; flex-direction: column;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.sp-head, .chips, .results { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sp-head { display: flex; align-items: center; gap: 8px; }
.sp-head input { flex: 1; min-width: 0; height: 50px; border: 2px solid var(--line); border-radius: var(--r-pill); padding: 0 18px; background: var(--paper-2);
  font: 600 17px var(--f-body); color: var(--ink); outline: none; }
.sp-head input:focus { border-color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px; scrollbar-width: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 4px; border: 1.5px solid var(--line); border-radius: var(--r-pill);
  background: var(--paper); font: 600 14px var(--f-body); white-space: nowrap; }
.chip.on { border-color: var(--cat); background: color-mix(in srgb, var(--cat) 14%, var(--paper)); }
.chip-ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--cat); color: #fff; }
.chip-ico svg { width: 15px; height: 15px; }
.results { list-style: none; margin: 0; overflow-y: auto; flex: 1; padding-bottom: 24px; }
.results button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.r-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.r-txt b { font: 700 16px var(--f-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-txt small { color: var(--ink-2); font-size: 13px; }
.r-d { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.results .empty { padding: 24px 4px; color: var(--ink-2); }

.toast { position: absolute; z-index: 9; left: 50%; bottom: calc(30% + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px); max-width: calc(100% - 48px);
  padding: 10px 16px; border-radius: var(--r-pill); background: var(--ink); color: var(--paper); font: 600 14px var(--f-body); opacity: 0; transition: .25s; pointer-events: none; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.splash { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--lagoon); color: #fff; transition: opacity .6s .2s; }
.splash-in { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 300px; padding: 0 24px; text-align: center; }
.splash-btn { border: 0; border-radius: 999px; padding: 10px 18px; background: #fff; color: var(--lagoon); font: 700 15px var(--f-body); }
.attrib { position: absolute; z-index: 1; right: max(8px, env(safe-area-inset-right, 0px)); bottom: calc(4px + env(safe-area-inset-bottom, 0px)); font: 500 10.5px var(--f-body); color: var(--ink-2); background: color-mix(in srgb, var(--paper) 75%, transparent); padding: 2px 6px; border-radius: 6px; }
.attrib a { color: inherit; }
.sp-foot { margin: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent-2); font: 600 12px var(--f-body); text-decoration: underline; }
.splash b { font: 800 34px var(--f-display); letter-spacing: .01em; }
.splash small { display: block; font: 600 14px var(--f-body); opacity: .85; text-align: center; }
body.ready .splash { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .nav-top.soon .nav-ico { animation: none; } }
</style>
<div id="app">
  <div id="map"></div>
  <div id="labels"></div>
  <header class="topbar"><button type="button" id="searchBtn" class="search-pill" aria-label="Ziel suchen"></button></header>
  <div class="loc-chip" id="locChip"></div>
  <div class="fabs">
    <button type="button" id="compassBtn" class="fab" aria-label="Karte nach Norden ausrichten"><span id="needle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l4 10h-8z" fill="#e5484d"/><path d="M12 22l-4-10h8z" fill="currentColor" opacity=".55"/></svg></span></button>
    <button type="button" id="tiltBtn" class="fab" aria-label="Zwischen 2D und 3D wechseln">2D</button>
    <button type="button" id="locateBtn" class="fab" aria-label="Auf meinen Standort zentrieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>
  <section id="sheet" class="sheet" hidden></section>
  <div id="navTop" class="nav-top" hidden aria-live="polite">
    <div class="nav-main"><div class="nav-ico" id="navIco"></div><div><div class="nav-dist" id="navDist"></div><div class="nav-text" id="navText"></div></div></div>
    <div class="nav-then" id="navThen" hidden></div>
  </div>
  <div id="navBottom" class="nav-bottom" hidden>
    <div class="nb-row">
      <div class="nb-eta"><b id="navEta">--:--</b><small id="navRemain"></small></div>
      <button type="button" class="icon-btn" id="voiceBtn" aria-label="Sprachansagen an oder aus"></button>
      <button type="button" class="btn-end" id="endNav">Beenden</button>

    <div class="sim" id="simCtl"><span class="lab">Simulation</span>
      <div class="seg"><button type="button" data-speed="1">1×</button><button type="button" data-speed="4">4×</button><button type="button" data-speed="10">10×</button></div>
      <button type="button" class="icon-btn" id="simPlay" aria-label="Simulation pausieren"></button>
    </div>
  </div>
  <button type="button" id="recenter" class="recenter" hidden>Zentrieren</button>
  <div id="search" class="search-panel" hidden>
    <div class="sp-head"><button type="button" class="icon-btn" id="searchBack" aria-label="Zurück zur Karte"></button>
      <input id="q" type="search" placeholder="z. B. Silver Star, Pizza, WC" autocomplete="off" enterkeyhint="go" aria-label="Ziel suchen"></div>
    <div class="chips" id="chips"></div>
    <ul class="results" id="results"></ul>
    <p class="sp-foot">Kartendaten © OpenStreetMap-Mitwirkende (ODbL) · <span id="dataAge"></span> <button type="button" id="refreshData" class="link-btn">Daten neu laden</button></p>
  </div>
  <div id="toast" class="toast" hidden role="status"></div>
  <div class="splash"><div class="splash-in"><b>Parkpilot</b><small id="splashMsg">Karte wird geladen …</small><button type="button" id="splashRetry" class="splash-btn" hidden>Erneut versuchen</button></div></div>
  <div class="attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende</div>
